name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build the library and run the tests (CMake / CTest)
        run: |
          cmake -B build -DCMAKE_C_FLAGS="-Wall -Wextra -Werror"
          cmake --build build
          ctest --test-dir build --output-on-failure

      - name: Re-run the tests standalone under ASan / UBSan
        run: |
          CFLAGS="-std=gnu11 -O2 -Wall -Wextra -fsanitize=address,undefined -fno-sanitize-recover=all" \
            sh tests/run.sh

  build-and-test-musl:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    # Ubuntu's aarch64 libgcc.a calls glibc's __getauxval for the outline
    # atomics (LSE); musl has no such symbol, so they are inlined there.
    env:
      ARCH_CFLAGS: ${{ runner.arch == 'ARM64' && '-mno-outline-atomics' || '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install the musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build the library and run the tests (CMake / CTest, musl-gcc)
        run: |
          cmake -B build-musl -DCMAKE_C_COMPILER=musl-gcc -DCMAKE_C_FLAGS="-Wall -Wextra -Werror ${ARCH_CFLAGS}"
          cmake --build build-musl
          ctest --test-dir build-musl --output-on-failure

      - name: Re-run the tests standalone, statically linked against musl
        run: |
          CC=musl-gcc CFLAGS="-std=gnu11 -O2 -Wall -Wextra -Werror -static ${ARCH_CFLAGS}" \
            sh tests/run.sh
