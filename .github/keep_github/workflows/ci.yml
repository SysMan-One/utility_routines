name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build the library and run the tests (CMake / CTest)
        run: |
          cmake -B build -DCMAKE_C_FLAGS="-Wall -Wextra -Werror"
          cmake --build build
          ctest --test-dir build --output-on-failure

      - name: Re-run the tests standalone under ASan / UBSan
        run: |
          CFLAGS="-std=gnu11 -O2 -Wall -Wextra -fsanitize=address,undefined -fno-sanitize-recover=all" \
            sh tests/run.sh
